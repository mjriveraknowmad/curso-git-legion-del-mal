
name: Reclutamiento de Agente

# Controla cuándo se ejecutará el workflow
on: push

jobs:
  # Este workflow contiene un solo job llamado "reporte-de-reclutamiento"
  reporte-de-reclutamiento:
    # el job correrá en un ubuntu
    runs-on: ubuntu-latest

    steps:
      # Ejecuta un comando usando la shell del runner
      - name: El agente se presenta
        run: echo "Hola, me presento como nuevo agente."

      - name: Reporte de identidad
        run: |
          echo "Reporte de identidad:"
          echo "====================="
          echo ""
          echo "Nombre clave: ${{ github.actor }}"
          echo "Contexto de GitHub"
          echo "Repositorio: ${{ github.repository }}"
          echo "Operación (sha): ${{ github.sha }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Metadata: ${{ toJSON(github) }}"

      - name: Capacidades
        run: |
          echo "Reporte de capacidades:"
          echo "======================="
          echo ""
          echo "Sistema Operativo"
          uname -a
          echo "Node.js"
          node --version
          echo "Git"
          git --version
          echo "Python"
          python3 --version
      
      - name: Reconocimiento del entorno
        run: |
          echo "Reporte del entorno:"
          echo "====================="
          echo ""
          echo "Directorio actual"
          pwd
          echo "Contenido del directorio"
          ls -la